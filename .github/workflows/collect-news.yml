name: Collect News

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Collect RSS
        run: node scripts/collect-rss.js

      - name: Collect MOE Policy (HTML)
        run: node scripts/collect-moe-policy.js

      - name: Collect Job Market Reports (News RSS)
        run: node scripts/collect-job-reports.js

      - name: Fetch Full Content
        run: node scripts/fetch-content.js

      - name: AI Process & Translate
        run: node scripts/ai-process.js
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Cluster
        run: node scripts/cluster.js

      - name: Generate JSON
        run: node scripts/generate-json.js

      - name: Build site & sync to repo root
        run: |
          # 清除缓存确保全新构建
          rm -rf node_modules/.vite node_modules/.cache .vite dist 2>/dev/null || true
          # 正常构建到 dist/（Vite v5 拒绝输出到根目录）
          npx vite build
          echo "=== 构建产物 ==="
          ls -lh dist/index.html 2>/dev/null && echo "✓ dist/index.html 已构建" || { echo "✗ 构建失败"; exit 1; }
          # 复制到仓库根目录（GitHub Pages 服务根目录）
          cp dist/index.html index.html
          echo "✓ 已同步 index.html 到仓库根"
          # 验证新版代码是否包含运行时数据加载
          if grep -q 'public/data' index.html 2>/dev/null; then
            echo "✓ 包含运行时数据加载代码（新版）"
          else
            echo "⚠️ 警告：未检测到 public/data 引用"
            echo "  可能原因：useArticles.js 改动未生效 / Vite tree-shaking 移除了代码"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 数据 + 重新构建的单文件 app 一起提交，确保线上使用最新代码读取最新数据
          git add public/data/ index.html
          if ! git diff --staged --quiet; then
            git commit -m "auto: update news data + site $(date -u '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
