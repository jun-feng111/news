name: Collect News

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Collect RSS
        run: node scripts/collect-rss.js

      - name: Collect MOE Policy (HTML)
        run: node scripts/collect-moe-policy.js

      - name: Collect Job Market Reports (News RSS)
        run: node scripts/collect-job-reports.js

      - name: Fetch Full Content
        run: node scripts/fetch-content.js

      - name: AI Process & Translate
        run: node scripts/ai-process.js
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Cluster
        run: node scripts/cluster.js

      - name: Generate JSON
        run: node scripts/generate-json.js

      - name: Build site (vite single-file)
        run: npm run build

      - name: Sync built app to repo root
        run: cp dist/index.html index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 数据 + 重新构建的单文件 app 一起提交，确保线上使用最新代码读取最新数据
          git add public/data/ index.html
          if ! git diff --staged --quiet; then
            git commit -m "auto: update news data + site $(date -u '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
