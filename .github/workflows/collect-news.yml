name: Collect News

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Collect RSS
        run: node scripts/collect-rss.js

      - name: Collect MOE Policy (HTML)
        run: node scripts/collect-moe-policy.js

      - name: Collect Employment Policy (Multi-source)
        run: node scripts/collect-policy.js

      - name: Collect Job Market Reports (News RSS)
        run: node scripts/collect-job-reports.js

      - name: Collect Job Details (Position salary/skill/prospect)
        run: node scripts/collect-job-details.js

      - name: Collect Real Job Postings (Legal APIs)
        run: node scripts/collect-jobs.js
        # 合规数据源：RemoteOK / Remotive / Arbeitnow 免密 API + 可选 Adzuna 密钥
        # 红线：不直爬 智联/BOSS直聘/猎聘 等（SPA 反爬 + 违反 ToS）
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY: ${{ secrets.ADZUNA_COUNTRY }}

      - name: Fetch Full Content
        run: node scripts/fetch-content.js

      - name: AI Process & Translate
        run: node scripts/ai-process.js
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Cluster
        run: node scripts/cluster.js

      - name: Generate JSON
        run: node scripts/generate-json.js

      - name: Resolve Tracking URLs
        run: node scripts/resolve-urls.cjs
        # 修复采集时未能解析的 Bing/Google 跟踪链接，确保文章链接可点击
        timeout-minutes: 15

      - name: Derive lite views (top/category)
        run: node scripts/derive-lite.js
        # 在链接修正之后派生 top-today / category-top，保证 url 已是真实地址

      - name: Build site & sync to repo root
        run: |
          # 清除缓存确保全新构建
          rm -rf node_modules/.vite node_modules/.cache .vite dist 2>/dev/null || true
          # 正常构建到 dist/
          npx vite build
          echo "=== 构建产物 ==="
          ls -lhR dist/
          # 自动找到构建输出的 HTML 文件（可能是 index.html 或 entry.html）
          BUILT_HTML=$(find dist -name "*.html" -type f | head -1)
          if [ -z "$BUILT_HTML" ]; then
            echo "✗ 构建失败：dist/ 中未找到 HTML 文件"
            exit 1
          fi
          echo "✓ 构建产物: $BUILT_HTML"
          # 复制到仓库根目录，统一命名为 index.html（GitHub Pages 默认入口）
          cp "$BUILT_HTML" index.html
          echo "✓ 已同步 index.html 到仓库根"
          # 验证新版代码是否包含运行时数据加载
          if grep -q 'public/data' index.html 2>/dev/null; then
            echo "✓ 包含运行时数据加载代码（新版）"
          else
            echo "⚠️ 警告：未检测到 public/data 引用"
            echo "  可能原因：useArticles.js 改动未生效 / Vite tree-shaking 移除了代码"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 数据 + 重新构建的单文件 app 一起提交，确保线上使用最新代码读取最新数据
          git add -A public/data/ index.html _headers
          if ! git diff --staged --quiet; then
            git commit -m "auto: update news data + site $(date -u '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
