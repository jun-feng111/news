name: Collect News

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Collect RSS
        run: node scripts/collect-rss.js

      - name: Collect MOE Policy (HTML)
        run: node scripts/collect-moe-policy.js

      - name: Collect Job Market Reports (News RSS)
        run: node scripts/collect-job-reports.js

      - name: Fetch Full Content
        run: node scripts/fetch-content.js

      - name: AI Process & Translate
        run: node scripts/ai-process.js
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Cluster
        run: node scripts/cluster.js

      - name: Generate JSON
        run: node scripts/generate-json.js

      - name: Build site (output to repo root)
        run: |
          # 清除 Vite/构建缓存，确保每次都用最新源码重新构建
          rm -rf node_modules/.vite node_modules/.cache dist .vite 2>/dev/null || true
          npx vite build --outDir . --emptyOutDir false --force
          echo "=== 构建产物验证 ==="
          ls -lh index.html 2>/dev/null && echo "✓ index.html 已生成" || echo "✗ index.html 未生成"
          # 验证新代码确实被打包进去（运行时 fetch 而非静态内联）
          if grep -q 'public/data' index.html 2>/dev/null; then
            echo "✓ 包含运行时数据加载代码（新版）"
          else
            echo "⚠️ 未检测到 public/data 引用，可能仍为旧版缓存构建"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 数据 + 重新构建的单文件 app 一起提交，确保线上使用最新代码读取最新数据
          git add public/data/ index.html
          if ! git diff --staged --quiet; then
            git commit -m "auto: update news data + site $(date -u '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
